name: weekly-report

on:
  schedule:
    # 13:00 UTC every Saturday — Friday's weekly close is final by then.
    - cron: "0 13 * * 6"
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Optional completed calendar Friday (YYYY-MM-DD)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e .

      - name: Generate weekly report (cross-validated)
        env:
          WEEK_ENDING: ${{ inputs.week_ending }}
        run: |
          args=(
            report
            --output-dir reports/weekly
            --history reports/history.csv
            --strict
          )
          if [[ -n "$WEEK_ENDING" ]]; then
            args+=(--week-ending "$WEEK_ENDING")
          fi
          PYTHONPATH=src python -m market_tracking.cli "${args[@]}"

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/weekly reports/history.csv
          if git diff --staged --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: weekly market report $(date -u +%Y-%m-%d)"
            git push
          fi
